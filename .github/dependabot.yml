version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 19
    labels:
      - "Type: dependencies"
    cooldown:
      exclude:
        - "io.toolisticon.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    labels:
      - "Type: dependencies"
